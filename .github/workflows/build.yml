name: Build / Release DraftLite

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione da pubblicare (es. 1.6.2)'
        required: true
        type: string
      create_release:
        description: 'Crea la Release GitHub'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Trova il progetto
        id: paths
        shell: pwsh
        run: |
          $csproj = Get-ChildItem -Path . -Recurse -Filter DraftLite.csproj -File | Select-Object -First 1
          if (-not $csproj) { throw "DraftLite.csproj non trovato nel repository" }

          $root = (Resolve-Path (Join-Path $csproj.Directory.FullName '..\..')).Path
          $repo = (Get-Location).Path
          $rel  = $root.Substring($repo.Length).TrimStart('\')
          if ([string]::IsNullOrEmpty($rel)) { $rel = '.' }

          "root=$rel"                  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "csproj=$($csproj.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Progetto trovato in: $rel"

      - name: Determina versione
        id: ver
        shell: pwsh
        run: |
          $root = "${{ steps.paths.outputs.root }}"
          $versionFile = Join-Path $root "Directory.Build.props"
          if (-not (Test-Path $versionFile)) { throw "Directory.Build.props non trovato: $versionFile" }

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $base = "${{ inputs.version }}".Trim()
            if ($base -notmatch '^\d+\.\d+\.\d+$') {
              throw "Versione non valida '$base'. Usa MAJOR.MINOR.PATCH, per esempio 1.6.2"
            }
            $info = $base
            $release = "true"
          }
          else {
            [xml]$versionXml = Get-Content $versionFile -Raw
            $base = [string](@($versionXml.Project.PropertyGroup.Version)[0])
            $base = $base.Trim()
            if ($base -notmatch '^\d+\.\d+\.\d+$') {
              throw "Versione non valida in Directory.Build.props: $base"
            }
            $info = "$base-dev.${{ github.run_number }}"
            $release = "false"
          }

          "numeric=$base"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$info"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "is_release=$release" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Build DraftLite $info"

      # Quando lanci la release dalla pagina Actions, il numero inserito diventa anche
      # la versione salvata nel repository. Non devi modificare file a mano sul PC.
      - name: Salva la nuova versione nel repository
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $root = "${{ steps.paths.outputs.root }}"
          $versionFile = Join-Path $root "Directory.Build.props"
          [xml]$xml = Get-Content $versionFile -Raw
          $node = $xml.SelectSingleNode("/Project/PropertyGroup/Version")
          if ($null -eq $node) { throw "Nodo <Version> non trovato in Directory.Build.props" }
          $node.InnerText = "${{ steps.ver.outputs.numeric }}"

          $settings = New-Object System.Xml.XmlWriterSettings
          $settings.Indent = $true
          $settings.IndentChars = "  "
          $settings.NewLineChars = "`n"
          $settings.NewLineHandling = [System.Xml.NewLineHandling]::Replace
          $settings.OmitXmlDeclaration = $true
          $writer = [System.Xml.XmlWriter]::Create($versionFile, $settings)
          $xml.Save($writer)
          $writer.Close()

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$versionFile"
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: version ${{ steps.ver.outputs.numeric }} [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          }
          else {
            Write-Host "Directory.Build.props e' gia' alla versione richiesta."
          }

      - name: Restore
        run: dotnet restore "${{ steps.paths.outputs.csproj }}"

      - name: Publish (win-x64, self-contained)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.numeric }}"
          dotnet publish "${{ steps.paths.outputs.csproj }}" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishReadyToRun=true `
            -p:DebugType=none `
            -p:Version=$v `
            -p:VersionPrefix=$v `
            -p:AssemblyVersion="$v.0" `
            -p:FileVersion="$v.0" `
            -p:InformationalVersion="${{ steps.ver.outputs.version }}" `
            -o "${{ steps.paths.outputs.root }}/publish"

      - name: Verifica versione EXE
        shell: pwsh
        run: |
          $exe = Join-Path "${{ steps.paths.outputs.root }}" "publish\DraftLite.exe"
          if (-not (Test-Path $exe)) { throw "DraftLite.exe non trovato" }
          $expected = "${{ steps.ver.outputs.numeric }}.0"
          $actual = (Get-Item $exe).VersionInfo.FileVersion
          Write-Host "FileVersion EXE: $actual"
          if ($actual -ne $expected) {
            throw "Versione EXE errata: attesa $expected, trovata $actual"
          }

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            $found = Get-ChildItem -Path "C:\Program Files (x86)","C:\Program Files" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            if ($found) { $iscc = $found.FullName }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe non trovato" }

          $iss = Join-Path "${{ steps.paths.outputs.root }}" "installer\DraftLite.iss"
          & $iscc /DMyAppVersion=${{ steps.ver.outputs.numeric }} $iss
          if ($LASTEXITCODE -ne 0) { throw "Compilazione installer fallita ($LASTEXITCODE)" }

      - name: Prepara i file
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $root = "${{ steps.paths.outputs.root }}"
          $ver = "${{ steps.ver.outputs.numeric }}"
          $setupSource = Get-ChildItem (Join-Path $root "installer\Output\*.exe") | Select-Object -First 1
          $portableSource = Join-Path $root "publish\DraftLite.exe"
          if (-not $setupSource) { throw "Installer non trovato" }
          if (-not (Test-Path $portableSource)) { throw "Eseguibile portabile non trovato" }

          Copy-Item $setupSource.FullName dist\DraftLite-Setup.exe
          Copy-Item $setupSource.FullName ("dist\DraftLite-Setup-{0}.exe" -f $ver)
          Copy-Item $portableSource dist\DraftLite-Portabile.exe
          Copy-Item $portableSource ("dist\DraftLite-Portabile-{0}.exe" -f $ver)

          $notes = @()
          $notes += "## DraftLite $ver"
          $notes += ""
          $notes += "**DraftLite-Setup.exe** - installazione normale."
          $notes += ""
          $notes += "**DraftLite-Portabile.exe** - versione portabile, senza installazione."
          $notes += ""
          $notes += "| File | Dimensione | SHA-256 |"
          $notes += "|---|---:|---|"
          foreach ($f in Get-ChildItem dist\*.exe) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $mb = [math]::Round($f.Length / 1MB, 1)
            $notes += "| $($f.Name) | $mb MB | ``$hash`` |"
          }
          $notes -join "`n" | Out-File release-notes.md -Encoding utf8

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DraftLite-${{ steps.ver.outputs.numeric }}-win-x64
          path: dist\*
          if-no-files-found: error

      - name: Crea/Aggiorna Release GitHub
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.numeric }}
          name: DraftLite ${{ steps.ver.outputs.numeric }}
          target_commitish: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: release-notes.md
          files: dist\*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
