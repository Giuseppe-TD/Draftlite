name: build

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Versione
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          if ($ref -like 'refs/tags/v*') {
            $v = $ref -replace '^refs/tags/v',''
          } else {
            $v = "1.2.0-dev.${{ github.run_number }}"
          }
          $num = ($v -split '-')[0]
          if ($num -notmatch '^\d+\.\d+\.\d+$') { $num = '1.2.0' }
          "version=$v"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "numeric=$num"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Versione: $v (assembly $num)"

      - name: Restore
        run: dotnet restore src/DraftLite/DraftLite.csproj

      - name: Publish (win-x64, self-contained)
        run: >
          dotnet publish src/DraftLite/DraftLite.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.numeric }}
          -p:InformationalVersion=${{ steps.ver.outputs.version }}
          -o publish

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup non presente sul runner: lo installo"
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            $found = Get-ChildItem -Path "C:\Program Files (x86)","C:\Program Files" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            if ($found) { $iscc = $found.FullName }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe non trovato: impossibile creare l'installer" }

          & $iscc /DMyAppVersion=${{ steps.ver.outputs.numeric }} installer\DraftLite.iss
          if ($LASTEXITCODE -ne 0) { throw "Compilazione dell'installer fallita ($LASTEXITCODE)" }

          $setup = Get-ChildItem installer\Output\*.exe | Select-Object -First 1
          if (-not $setup) { throw "Installer non prodotto" }
          Write-Host "Installer: $($setup.Name) - $([math]::Round($setup.Length/1MB,1)) MB"

      - name: Prepara i file della release
        id: dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # nomi senza numero di versione: cosi' il link di download resta sempre lo stesso
          Copy-Item installer\Output\*.exe dist\DraftLite-Setup.exe
          Copy-Item publish\DraftLite.exe  dist\DraftLite-Portabile.exe

          $notes = @()
          $notes += "**DraftLite-Setup.exe** - installazione normale: collegamenti, associazione dei file .dlite, disinstallazione dal Pannello di controllo."
          $notes += ""
          $notes += "**DraftLite-Portabile.exe** - un file solo, si avvia e basta: niente installazione, buono per la chiavetta."
          $notes += ""
          $notes += "Serve Windows 10 o successivo a 64 bit. Non serve installare .NET: e' gia' dentro l'eseguibile."
          $notes += ""
          $notes += "Al primo avvio Windows puo' mostrare l'avviso SmartScreen perche' il file non e' firmato:"
          $notes += "*Altre informazioni* > *Esegui comunque*."
          $notes += ""
          $notes += "| File | Dimensione | SHA-256 |"
          $notes += "|---|---:|---|"
          foreach ($f in Get-ChildItem dist\*.exe) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $mb = [math]::Round($f.Length / 1MB, 1)
            $notes += "| $($f.Name) | $mb MB | ``$hash`` |"
          }
          $notes -join "`n" | Out-File -FilePath release-notes.md -Encoding utf8

          Get-ChildItem dist | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
          Get-Content release-notes.md

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DraftLite-win-x64
          path: dist\*
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DraftLite ${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: release-notes.md
          files: dist\*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
