name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Versione
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          if ($ref -like 'refs/tags/v*') {
            $v = $ref -replace '^refs/tags/v',''
          } else {
            $v = "1.0.0-dev.${{ github.run_number }}"
          }
          $num = ($v -split '-')[0]
          if ($num -notmatch '^\d+\.\d+\.\d+$') { $num = '1.0.0' }
          "version=$v"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "numeric=$num"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Versione: $v (assembly $num)"

      - name: Restore
        run: dotnet restore src/DraftLite/DraftLite.csproj

      - name: Publish (win-x64, self-contained)
        run: >
          dotnet publish src/DraftLite/DraftLite.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.numeric }}
          -p:InformationalVersion=${{ steps.ver.outputs.version }}
          -o publish

      - name: Pacchetto ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item publish/DraftLite.exe dist/DraftLite.exe
          Copy-Item README.md dist/LEGGIMI.md -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/* -DestinationPath DraftLite-${{ steps.ver.outputs.version }}-win-x64.zip -Force

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DraftLite-win-x64
          path: |
            publish/DraftLite.exe
            DraftLite-*.zip
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DraftLite ${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            DraftLite-${{ steps.ver.outputs.version }}-win-x64.zip
            publish/DraftLite.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
