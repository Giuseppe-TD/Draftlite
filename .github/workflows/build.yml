name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Versione
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          if ($ref -like 'refs/tags/v*') {
            $v = $ref -replace '^refs/tags/v',''
          } else {
            $v = "1.2.0-dev.${{ github.run_number }}"
          }
          $num = ($v -split '-')[0]
          if ($num -notmatch '^\d+\.\d+\.\d+$') { $num = '1.2.0' }
          "version=$v"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "numeric=$num"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Versione: $v (assembly $num)"

      - name: Restore
        run: dotnet restore src/DraftLite/DraftLite.csproj

      - name: Publish (win-x64, self-contained)
        run: >
          dotnet publish src/DraftLite/DraftLite.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.numeric }}
          -p:InformationalVersion=${{ steps.ver.outputs.version }}
          -o publish

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup non presente sul runner: lo installo"
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            $found = Get-ChildItem -Path "C:\Program Files (x86)","C:\Program Files" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            if ($found) { $iscc = $found.FullName }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe non trovato: impossibile creare l'installer" }

          & $iscc /DMyAppVersion=${{ steps.ver.outputs.numeric }} installer\DraftLite.iss
          if ($LASTEXITCODE -ne 0) { throw "Compilazione dell'installer fallita ($LASTEXITCODE)" }

          $setup = Get-ChildItem installer\Output\*.exe | Select-Object -First 1
          if (-not $setup) { throw "Installer non prodotto" }
          Write-Host "Installer: $($setup.Name) - $([math]::Round($setup.Length/1MB,1)) MB"

      - name: Rinomina i file della release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item publish\DraftLite.exe "dist\DraftLite-${{ steps.ver.outputs.version }}-portabile.exe"
          Copy-Item installer\Output\*.exe "dist\DraftLite-Setup-${{ steps.ver.outputs.version }}.exe"
          Get-ChildItem dist | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DraftLite-win-x64
          path: dist\*
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DraftLite ${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            **DraftLite-Setup-${{ steps.ver.outputs.version }}.exe** — installazione normale: collegamenti, associazione dei file .dlite, disinstallazione dal Pannello di controllo.

            **DraftLite-${{ steps.ver.outputs.version }}-portabile.exe** — un file solo, si avvia e basta: niente installazione, buono per la chiavetta.

            Serve Windows 10 o successivo a 64 bit. Non serve installare .NET.
          files: dist\*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
