name: build

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'        # v1.2.3
      - '[0-9]*'    # 1.2.3 (senza la v)
  # quando la release si crea o si modifica dal sito di GitHub
  release:
    types: [ published, created, edited, released ]

  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Trova il progetto
        id: paths
        shell: pwsh
        run: |
          # il repository puo' avere i file alla radice oppure dentro una sottocartella:
          # si cerca il .csproj e si ricava da li' la radice del progetto
          $csproj = Get-ChildItem -Path . -Recurse -Filter DraftLite.csproj -File | Select-Object -First 1
          if (-not $csproj) { throw "DraftLite.csproj non trovato nel repository" }

          $root = (Resolve-Path (Join-Path $csproj.Directory.FullName '..\..')).Path
          $repo = (Get-Location).Path
          $rel  = $root.Substring($repo.Length).TrimStart('\')
          if ([string]::IsNullOrEmpty($rel)) { $rel = '.' }

          "root=$rel"                  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "csproj=$($csproj.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Progetto trovato in: $rel"
          Write-Host "Csproj: $($csproj.FullName)"

      - name: Versione
        id: ver
        shell: pwsh
        run: |
          $ref  = "${{ github.ref }}"
          $rtag = "${{ github.event.release.tag_name }}"

          # Directory.Build.props e' l'unica sorgente del numero di versione.
          # Eseguibile, About, updater, installer e release usano tutti questo valore.
          $root = "${{ steps.paths.outputs.root }}"
          $versionFile = Join-Path $root "Directory.Build.props"
          if (-not (Test-Path $versionFile)) { throw "Directory.Build.props non trovato: $versionFile" }
          [xml]$versionXml = Get-Content $versionFile -Raw
          $base = [string](@($versionXml.Project.PropertyGroup.Version)[0])
          $base = $base.Trim()
          if ($base -notmatch '^\d+\.\d+\.\d+$') { throw "Versione non valida in Directory.Build.props: $base" }

          # Se si pubblica un tag/release, deve coincidere con la versione del progetto.
          $tagVersion = $null
          if (-not [string]::IsNullOrEmpty($rtag)) {
            $tagVersion = $rtag -replace '^[vV]',''
          } elseif ($ref -like 'refs/tags/*') {
            $tagVersion = (($ref -replace '^refs/tags/','') -replace '^[vV]','')
          }
          if ($tagVersion -and $tagVersion -ne $base) {
            throw "Il tag/release e' $tagVersion ma Directory.Build.props contiene $base. Aggiorna la versione prima di pubblicare."
          }

          if ($tagVersion) {
            $v = $base
          } else {
            $v = "$base-dev.${{ github.run_number }}"
          }
          "version=$v"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "numeric=$base" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Versione: $v (assembly/file/installer $base)"

      - name: Restore
        run: dotnet restore "${{ steps.paths.outputs.csproj }}"

      - name: Publish (win-x64, self-contained)
        run: >
          dotnet publish "${{ steps.paths.outputs.csproj }}"
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.numeric }}
          -p:InformationalVersion=${{ steps.ver.outputs.version }}
          -o "${{ steps.paths.outputs.root }}/publish"

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup non presente sul runner: lo installo"
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            $found = Get-ChildItem -Path "C:\Program Files (x86)","C:\Program Files" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            if ($found) { $iscc = $found.FullName }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe non trovato: impossibile creare l'installer" }

          $iss = Join-Path "${{ steps.paths.outputs.root }}" "installer\DraftLite.iss"
          if (-not (Test-Path $iss)) { throw "Script installer non trovato: $iss" }

          & $iscc /DMyAppVersion=${{ steps.ver.outputs.numeric }} $iss
          if ($LASTEXITCODE -ne 0) { throw "Compilazione dell'installer fallita ($LASTEXITCODE)" }

          $setup = Get-ChildItem (Join-Path "${{ steps.paths.outputs.root }}" "installer\Output\*.exe") | Select-Object -First 1
          if (-not $setup) { throw "Installer non prodotto" }
          Write-Host "Installer: $($setup.Name) - $([math]::Round($setup.Length/1MB,1)) MB"

      - name: Prepara i file della release
        id: dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # Manteniamo sia i nomi stabili (per i link /latest/download) sia quelli
          # versionati, cosi' dal file scaricato si vede subito quale build e'.
          $root = "${{ steps.paths.outputs.root }}"
          $ver = "${{ steps.ver.outputs.numeric }}"
          $setupSource = Get-ChildItem (Join-Path $root "installer\Output\*.exe") | Select-Object -First 1
          $portableSource = Join-Path $root "publish\DraftLite.exe"
          if (-not $setupSource) { throw "Installer non trovato per preparare la release" }
          if (-not (Test-Path $portableSource)) { throw "Eseguibile portabile non trovato" }

          Copy-Item $setupSource.FullName dist\DraftLite-Setup.exe
          Copy-Item $setupSource.FullName ("dist\DraftLite-Setup-{0}.exe" -f $ver)
          Copy-Item $portableSource dist\DraftLite-Portabile.exe
          Copy-Item $portableSource ("dist\DraftLite-Portabile-{0}.exe" -f $ver)

          $notes = @()
          $notes += "**DraftLite-Setup.exe** - installazione normale: collegamenti, associazione dei file .dlite, disinstallazione dal Pannello di controllo."
          $notes += ""
          $notes += "**DraftLite-Portabile.exe** - un file solo, si avvia e basta: niente installazione, buono per la chiavetta."
          $notes += ""
          $notes += "Serve Windows 10 o successivo a 64 bit. Non serve installare .NET: e' gia' dentro l'eseguibile."
          $notes += ""
          $notes += "Al primo avvio Windows puo' mostrare l'avviso SmartScreen perche' il file non e' firmato:"
          $notes += "*Altre informazioni* > *Esegui comunque*."
          $notes += ""
          $notes += "| File | Dimensione | SHA-256 |"
          $notes += "|---|---:|---|"
          foreach ($f in Get-ChildItem dist\*.exe) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $mb = [math]::Round($f.Length / 1MB, 1)
            $notes += "| $($f.Name) | $mb MB | ``$hash`` |"
          }
          $notes -join "`n" | Out-File -FilePath release-notes.md -Encoding utf8

          Get-ChildItem dist | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
          Get-Content release-notes.md

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DraftLite-win-x64
          path: dist\*
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          name: DraftLite ${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: release-notes.md
          files: dist\*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
